# Nothing to report: every rule passes.
name: clean
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: some-org/lint-action@0123456789abcdef0123456789abcdef01234567 # v2.1.0
      - run: npm ci && npm test
